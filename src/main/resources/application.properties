spring.application.name=order-system-api

# 1. Base de Datos (Asegúrate de que el password sea 'postgres' o 'password')
spring.datasource.url=jdbc:postgresql://localhost:5432/order_system_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# 2. Estrategia de nombres (Correcto para cliente_id)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# 3. Hibernate y DDL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 4. Logs (CORREGIDO: minúsculas en logging)
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# 5. Swagger y Jackson
springdoc.swagger-ui.path=/swagger-ui.html
spring.jackson.serialization.fail-on-empty-beans=false